<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Cliente</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<h1 th:text="${customer.id == null} ? 'Nuevo Cliente' : 'Editar Cliente'"></h1>
<form action="#" th:action="@{/clientes/guardar}" th:object="${customer}" method="post">
    <input type="hidden" th:field="*{id}"/>
    <label>Nombre completo:</label>
    <input type="text" th:field="*{name}"/>
    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red"></span>
    <br/>
    <label>Tipo de documento:</label>
    <select th:field="*{documentType}">
        <option value="">Seleccione</option>
        <option value="DNI">DNI</option>
        <option value="RUC">RUC</option>
    </select>
    <span th:if="${#fields.hasErrors('documentType')}" th:errors="*{documentType}" style="color:red"></span>
    <br/>
    <label>Número de documento:</label>
    <input type="text" th:field="*{document}"/>
    <span th:if="${#fields.hasErrors('document')}" th:errors="*{document}" style="color:red"></span>
    <br/>
    <button type="submit">Guardar</button>
    <a href="/clientes">Cancelar</a>
</form>
</body>
</html>
