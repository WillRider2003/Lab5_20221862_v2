<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<h1>Gestión de Productos</h1>
<a href="/productos/nuevo">Nuevo Producto</a>
<table border="1">
    <thead>
    <tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr>
    </thead>
    <tbody>
    <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.price}"></td>
        <td th:text="${p.stock}"></td>
        <td>
            <a th:href="@{/productos/editar/{id}(id=${p.id})}">Editar</a>
            <a th:href="@{/productos/eliminar/{id}(id=${p.id})}">Eliminar</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
