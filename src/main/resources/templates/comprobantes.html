<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Comprobantes</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<h1>Lista de Comprobantes</h1>
<a href="/comprobantes/nuevo">Nuevo Comprobante</a>
<table border="1">
    <thead>
    <tr><th>ID</th><th>Tipo</th><th>Fecha</th><th>Cliente</th><th>Total</th></tr>
    </thead>
    <tbody>
    <tr th:each="inv : ${invoices}">
        <td th:text="${inv.id}"></td>
        <td th:text="${inv.type}"></td>
        <td th:text="${inv.date}"></td>
        <td th:text="${inv.customer.name}"></td>
        <td th:text="${#aggregates.sum(inv.details.![subtotal])}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
